[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperaudit"
version = "0.2.0"
description = "投前自审的验证器：对 Word 论文/开题报告做确定性审查，输出可逐条核查的问题清单"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "PaperAudit contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/mmrgr/PaperAudit"
Repository = "https://github.com/mmrgr/PaperAudit"
Issues = "https://github.com/mmrgr/PaperAudit/issues"

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
test = ["reportlab>=4.0"]

[project.scripts]
paperaudit = "paperaudit.cli:main"
paperaudit-desktop = "paperaudit.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperaudit = ["py.typed", "static/*.html"]

[tool.setuptools.data-files]
checklists = ["checklists/academic.yaml", "checklists/registry.yaml"]
venues = ["venues/registry.yaml"]
"checklists/biomedical" = [
    "checklists/biomedical/prisma.yaml",
    "checklists/biomedical/strobe.yaml",
    "checklists/biomedical/consort.yaml",
]
