name: PaperRevamper CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[pdf,test]"
      - name: Compile package and tests
        run: python -m compileall -q src tests
      - name: Check bundled control panel is synchronized
        run: diff -u ui/control-panel.html src/paperrevamper/static/control-panel.html
      - name: Run deterministic smoke suite
        run: python tests/smoke_suite.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist-ci

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install -e ".[test]"
      - name: Build desktop bundle
        shell: pwsh
        run: .\build_exe.ps1 -Mode onedir -PythonPath (Get-Command python).Source
      - name: Smoke packaged executable
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\PaperRevamper\PaperRevamper.exe'
          if (-not (Test-Path $exe)) { throw "Missing packaged executable: $exe" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable --help failed with exit code $LASTEXITCODE" }
          foreach ($required in @('_internal\checklists\academic.yaml', '_internal\venues\registry.yaml', '_internal\paperrevamper\static\control-panel.html')) {
            if (-not (Test-Path (Join-Path (Split-Path $exe) $required))) { throw "Missing packaged data: $required" }
          }
