version: 1
name: PaperRevamper venue profile registry

# These profiles are conservative templates, not official publisher rules.
# Replace or extend them with a reviewed local profile before submission.
venues:
  - id: generic-pre-submission
    name: 通用投前自审（模板）
    aliases: [generic, pre-submission]
    checklist: academic
    required_sections: [摘要, 引言, 方法, 结果, 讨论, 结论, 参考文献]
    stop_criteria:
      - 所有 major 的确定性问题已处理或由作者明确接受
      - 引用完整性与数字一致性检查无未解释失败
    scope: template
    status: builtin-template
    source_url: https://github.com/mmrgr/PaperRevamper
