# PaperAudit 学术审查清单（作者投前自审）
#
# 设计原则（docs/PLAN_v2.md §零）：
#   瓶颈在「定位错误」而非「修复」——RefineBench 证明给出显式清单后性能跃升。
#   因此清单是一等公民，且支持外部导入（会议/期刊的 author instructions）。
#
# 每个 item:
#   id       稳定标识，宿主回填 findings 时引用
#   q        检查什么
#   sev      默认严重度 major|minor|nit
#   judge    如何判定（给执行审查的 agent 看）
#   scope    适用文档类型：all | paper | proposal

version: 1
name: 通用学术文档投前自审
scope_hint: 论文（paper）与开题报告/申报书（proposal）通用；scope=all 的项两者都查。

groups:
  - id: structure
    name: 结构与完整性
    items:
      - id: S01
        q: 章节结构是否符合该类文档的通行规范
        sev: major
        scope: all
        judge: 对照目标模板检查必需章节是否齐全、顺序是否合理
      - id: S02
        q: 各章节篇幅比例是否失衡
        sev: minor
        scope: all
        judge: 是否有某一节过短（不足以支撑其标题）或过长（偏离主线）
      - id: S03
        q: 是否存在内容重复（同一段落在多处出现）
        sev: minor
        scope: all
        judge: 跨章节比对语义重合的段落
      - id: S04
        q: 章节编号体系是否一致、标题层级是否混乱
        sev: minor
        scope: all
        judge: 编号格式统一（如 1 / 1.1 / 1.1.1），同级标题语法结构一致

  - id: argument
    name: 论证与逻辑
    items:
      - id: A01
        q: 研究问题是否明确、是否贯穿全文
        sev: major
        scope: all
        judge: 能否用一句话概括研究问题；各章节是否都服务于它
      - id: A02
        q: 研究空白（gap）是否真正建立
        sev: major
        scope: all
        judge: 现状综述是否指向了"尚未解决"的具体点，而非泛泛说"研究不足"
      - id: A03
        q: 本文贡献是否清晰可辨
        sev: major
        scope: all
        judge: 贡献项是否逐条列出、是否与现有工作有明确区分
      - id: A04
        q: 结论是否被结果支持，有无过度声明
        sev: major
        scope: all
        judge: 检查 first/novel/significantly/突破性 等强断言是否有对应证据
      - id: A05
        q: 论证链是否存在断裂或循环论证
        sev: major
        scope: all
        judge: 从问题→方法→结果→结论逐步检查每一步是否成立
      - id: A06
        q: 创新点描述是否与现状综述矛盾
        sev: major
        scope: all
        judge: 若综述已提到类似工作，则"首次"类表述不成立

  - id: method
    name: 方法严谨性
    items:
      - id: M01
        q: 方法描述是否足够他人复现
        sev: major
        scope: all
        judge: 关键步骤、参数、数据来源是否交代清楚
      - id: M02
        q: 数据来源与处理是否说明
        sev: major
        scope: all
        judge: 数据获取途径、时间范围、样本量、清洗规则
      - id: M03
        q: 是否缺少必要的对比基线或消融实验
        sev: major
        scope: paper
        judge: 结论若优于现有方法，是否有对照
      - id: M04
        q: 假设与适用边界是否交代
        sev: minor
        scope: all
        judge: 隐含假设是否显性化，结论外推范围是否限定
      - id: M05
        q: 实验设计是否存在混淆因素
        sev: major
        scope: paper
        judge: 变量控制、随机性、多次重复是否处理
      - id: M06
        q: 技术路线是否可行、进度安排是否合理
        sev: major
        scope: proposal
        judge: 各阶段依赖关系是否成立，时间分配是否合理

  - id: data
    name: 数据与统计
    items:
      - id: D01
        q: 统计检验是否恰当
        sev: major
        scope: paper
        judge: 样本量是否支持所用检验，是否报告效应量与置信区间
      - id: D02
        q: 数字在摘要/正文/表格/结论之间是否一致
        sev: major
        scope: all
        judge: 逐项交叉核对同一指标的所有出现位置
      - id: D03
        q: 图表数据与其说明文字是否吻合
        sev: major
        scope: all
        judge: 表内数值与正文描述是否一致
      - id: D04
        q: 有效数字/单位是否规范统一
        sev: minor
        scope: all
        judge: 小数位一致、单位统一、百分比与绝对值不混用
      - id: D05
        q: 是否存在可疑或不可能的数值
        sev: major
        scope: all
        judge: 百分比之和、同比环比、量纲是否合理

  - id: citation
    name: 引用规范
    items:
      - id: C01
        q: 引用是否真实存在且信息准确
        sev: major
        scope: all
        judge: 作者、标题、年份、期刊是否与原文一致（编造引用是最严重问题）
      - id: C02
        q: 引用是否真正支持其所附论断
        sev: major
        scope: all
        judge: 被引文献的结论是否与本文论断一致；不能仅因标题相关就算支持
      - id: C03
        q: 关键论断是否缺少引用支撑
        sev: major
        scope: all
        judge: 事实性陈述、他人方法、公认结论是否标注来源
      - id: C04
        q: 引用格式是否全文统一
        sev: minor
        scope: all
        judge: 编号格式、作者年份格式不得混用
      - id: C05
        q: 是否存在过度自引或引用陈旧
        sev: minor
        scope: all
        judge: 近三年文献占比是否合理
      - id: C06
        q: 文献综述是否覆盖主要相关工作
        sev: major
        scope: all
        judge: 是否有明显遗漏的重要工作

  - id: figure
    name: 图表规范
    items:
      - id: F01
        q: 图表编号是否与正文引用对应
        sev: major
        scope: all
        judge: 正文提到的每个图/表编号是否都有对应题注
      - id: F02
        q: 题注是否完整（编号+说明）
        sev: minor
        scope: all
        judge: 题注能否让读者不看正文就理解图表
      - id: F03
        q: 图表是否都有正文解读
        sev: minor
        scope: all
        judge: 每个图表是否至少被正文提及并说明其含义
      - id: F04
        q: 图表可读性（坐标轴标注、图例、单位）
        sev: minor
        scope: all
        judge: 坐标轴是否有名称与单位，图例是否清晰

  - id: language
    name: 表述与语言
    items:
      - id: L01
        q: 术语是否全文统一
        sev: minor
        scope: all
        judge: 同一概念不得混用多个名称
      - id: L02
        q: 缩写首次出现是否给出全称
        sev: minor
        scope: all
        judge: 检查每个英文缩写的首次出现位置
      - id: L03
        q: 是否存在冗余、啰嗦或空洞表述
        sev: nit
        scope: all
        judge: 是否有可删而不损义的内容
      - id: L04
        q: 语句是否通顺、有无病句与错别字
        sev: minor
        scope: all
        judge: 逐句检查语法与用词
      - id: L05
        q: 时态、人称、语气是否规范一致
        sev: nit
        scope: all
        judge: 学术写作通常客观陈述，避免口语化

  - id: consistency
    name: 跨章节一致性
    items:
      - id: X01
        q: 摘要与正文/结论是否一致
        sev: major
        scope: all
        judge: 摘要中的数字、结论、范围是否与正文吻合
      - id: X02
        q: 开头提出的问题在结尾是否有回应
        sev: major
        scope: all
        judge: 首尾呼应检查
      - id: X03
        q: 前后术语与符号定义是否一致
        sev: minor
        scope: all
        judge: 同一符号不得在不同处有不同含义
      - id: X04
        q: 预期成果与研究内容是否匹配
        sev: major
        scope: proposal
        judge: 承诺的成果是否都能由所述内容产出
