version: 4-advisory
name: STROBE 观察性研究提交前自审（精简包）
scope_hint: 这是基于 STROBE 主题的定位清单，不替代官方完整 checklist。
groups:
  - id: strobe_design
    name: 设计与参与者
    items:
      - id: STROBE01
        q: 是否明确说明研究设计、研究场景、时间范围和研究对象来源
        sev: major
        scope: paper
        judge: 检查队列、病例对照或横断面设计及场景/日期是否清晰
      - id: STROBE02
        q: 纳入排除标准、变量定义和测量方法是否完整
        sev: major
        scope: paper
        judge: 检查主要暴露、结局、混杂因素和诊断/测量标准能否复现
      - id: STROBE03
        q: 是否报告参与者流程、缺失数据和选择偏倚风险
        sev: major
        scope: paper
        judge: 对照流程图或表格核对筛选、失访、排除和缺失数据处理
  - id: strobe_analysis
    name: 分析与解释
    items:
      - id: STROBE04
        q: 是否说明混杂控制、统计模型和敏感性分析
        sev: major
        scope: paper
        judge: 检查模型变量、效应量、区间、非线性/交互和稳健性分析
      - id: STROBE05
        q: 结果是否给出估计值、精确度和适用人群
        sev: major
        scope: paper
        judge: 检查主要结果与研究对象、暴露时间和不确定性是否对应
      - id: STROBE06
        q: 是否区分关联与因果并讨论偏倚和局限
        sev: minor
        scope: paper
        judge: 检查结论措辞是否超过观察性设计能够支持的范围
