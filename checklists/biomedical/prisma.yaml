version: 2020-advisory
name: PRISMA 系统综述与 Meta-analysis 提交前自审（精简包）
scope_hint: 这是基于 PRISMA 2020 主题的定位清单，不替代官方完整 checklist。
groups:
  - id: prisma_identification
    name: 研究识别与方案
    items:
      - id: PRISMA01
        q: 是否明确说明综述问题、纳入标准和研究对象
        sev: major
        scope: paper
        judge: 在摘要、引言和方法中定位问题、PICO/研究对象及预先定义的纳入排除标准
      - id: PRISMA02
        q: 是否说明检索来源、检索日期和完整检索策略
        sev: major
        scope: paper
        judge: 检查数据库、补充来源、最后检索日期和可复现的检索式是否齐全
      - id: PRISMA03
        q: 是否报告研究筛选和排除过程
        sev: major
        scope: paper
        judge: 检查流程图、去重、全文排除理由和最终纳入数量是否能互相核对
  - id: prisma_synthesis
    name: 质量评价与综合
    items:
      - id: PRISMA04
        q: 是否说明偏倚风险评价方法及其结果
        sev: major
        scope: paper
        judge: 检查工具、评价者、分歧处理和每项研究的评价结果
      - id: PRISMA05
        q: Meta-analysis 的模型、效应量、异质性和敏感性分析是否可复核
        sev: major
        scope: paper
        judge: 检查统计模型、效应量、区间、异质性指标和预先设定的敏感性/亚组分析
      - id: PRISMA06
        q: 是否讨论证据局限、偏倚和结论适用范围
        sev: minor
        scope: paper
        judge: 对照结果和偏倚评价检查结论是否超出证据范围
