version: 1
name: PaperRevamper checklist registry

# The registry is deliberately metadata-only.  Checklist content stays in
# separate YAML files so venues and study-design packs can be added without
# changing the loader or the prepare/verify contract.
checklists:
  - id: academic
    path: academic.yaml
    name: 通用学术文档投前自审
    aliases: [generic, paper, proposal, pre-submission]
    scopes: [paper, proposal, all]
    keywords: [论文, 学术, 开题, 申报书, manuscript, research]
    status: builtin
  - id: prisma
    path: biomedical/prisma.yaml
    name: PRISMA 系统综述与 Meta-analysis 提交前自审
    aliases: [systematic-review, meta-analysis, prisma2020]
    scopes: [paper]
    keywords: [systematic review, meta-analysis, meta analysis, prisma, literature review, 综述, 元分析]
    study_design: systematic_review
    source_url: https://www.prisma-statement.org/prisma-2020
    status: advisory
  - id: strobe
    path: biomedical/strobe.yaml
    name: STROBE 观察性研究提交前自审
    aliases: [observational, cohort, case-control, cross-sectional]
    scopes: [paper]
    keywords: [cohort, case-control, cross-sectional, observational, strobe, 队列, 病例对照, 横断面]
    study_design: observational
    source_url: https://www.strobe-statement.org/checklists/
    status: advisory
  - id: consort
    path: biomedical/consort.yaml
    name: CONSORT 随机对照试验提交前自审
    aliases: [randomized-trial, rct, clinical-trial]
    scopes: [paper]
    keywords: [randomized, randomised, controlled trial, clinical trial, consort, 随机对照, 临床试验]
    study_design: randomized_trial
    source_url: https://www.consort-spirit.org/
    status: advisory
